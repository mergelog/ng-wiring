<sm-editable-section>
  <sm-search search-button [value]="searchedText" [minimumChars]="1" [debounceTime]="0" (valueChanged)="searchTable($event)"></sm-search>
  <sm-experiment-execution-parameters [searchedText]="searchedText" (searchCounterChanged)="searchCounterChanged($event)" (scrollToResultCounterReset)="scrollIndexCounterReset()"></sm-experiment-execution-parameters>
  <button data-id="saveButton" (click)="save()"></button>
</sm-editable-section>
