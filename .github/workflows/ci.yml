name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `check:dist` runs first so a build mismatch is still reported when the contract check is red.
      - run: npm run check:dist
      - run: npm run check:contracts

  # §9 the pinned ngmaze is a GitHub dependency with a `prepare` script, so installing builds it on the
  # installing machine. This job proves that path from an empty npm cache into an empty directory.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm run check:install

  # §4.2 the supported systems are Linux/WSL, macOS and Windows, and A18 requires the pinned ngmaze bin
  # to start on each of them. WSL is covered by the Linux runner and by the local run recorded in
  # docs/performance.md.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run check:smoke
