name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `check:dist` runs first so a build mismatch is still reported when the contract check is red.
      - run: npm run check:dist
      - run: npm run check:contracts

  # §9 the pinned ngmaze is a GitHub dependency with a `prepare` script, so installing builds it on the
  # installing machine. This job proves that path from an empty npm cache into an empty directory.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm run check:install

  # §4.2 supports Linux/WSL, macOS and Windows. A18 requires the pinned ngmaze bin to start on each.
  # The full suite has POSIX-specific expectations, so a red Windows job is not a distribution failure.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run check:smoke

  # The existing Angular 22 contract suite uses its own Node minimum. The angular20 job below
  # separately verifies the CLI minimum, including engine-strict clean installation.
  node-versions:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:smoke

  angular20:
    name: Angular 20 / Node 22.22.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --omit=dev --engine-strict
      - run: npm run check:angular20
      - run: npm run check:install -- --angular20
