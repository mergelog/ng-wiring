name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `check:dist` runs first so a build mismatch is still reported when the contract check is red.
      - run: npm run check:dist
      - run: npm run check:contracts

  # §9 the pinned ngmaze is a GitHub dependency with a `prepare` script, so installing builds it on the
  # installing machine. This job proves that path from an empty npm cache into an empty directory.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm run check:install

  # §4.2 the supported systems are Linux/WSL, macOS and Windows, and A18 requires the pinned ngmaze bin
  # to start on each of them. WSL is covered by the Linux runner and by the local runs recorded in
  # docs/performance.md. Only the smoke test runs here: the rest of the suite fixes POSIX paths in its
  # expectations, so a red Windows job would not be a distribution failure.
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run check:smoke

  # §4.2 `engines` is `^22.22.3 || ^24.15.0 || >=26.0.0`. The `build` job covers the 24.15.0 of §2; this
  # one runs the whole suite and the smoke test on the lowest supported version and on the newest
  # supported line, so a version-dependent failure is a test failure and not only a smoke failure.
  node-versions:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:smoke
